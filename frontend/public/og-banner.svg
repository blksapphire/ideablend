<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <!-- Clean flat background — light, no gradient -->
  <rect width="1200" height="630" fill="#FAFAFA" />

  <!-- Diamond logo mark (28px scaled up 3x to 84px) -->
  <path d="M84 40 L40 84 L84 84 Z" fill="#2563EB" />
  <path d="M84 84 L128 84 L84 128 Z" fill="#16A34A" />
  <path d="M84 40 L128 84 L84 84 Z" fill="#09090B" opacity="0.10" />
  <path d="M40 84 L84 84 L84 128 Z" fill="#09090B" opacity="0.10" />

  <!-- Wordmark -->
  <text x="144" y="104" font-family="Unbounded, Arial Black, sans-serif" font-weight="800" font-size="28" fill="#09090B">Idea Blend</text>

  <!-- Left: Headline copy -->
  <text x="60" y="220" font-family="Unbounded, Arial Black, sans-serif" font-weight="800" font-size="52" fill="#09090B">Find builders.</text>
  <text x="60" y="280" font-family="Unbounded, Arial Black, sans-serif" font-weight="800" font-size="52" fill="#09090B">Build together.</text>
  <text x="60" y="340" font-family="Unbounded, Arial Black, sans-serif" font-weight="800" font-size="52" fill="#2563EB">Ship something real.</text>

  <!-- Underline accent — single color, clean -->
  <rect x="60" y="356" width="280" height="3" rx="1.5" fill="#16A34A" />

  <text x="60" y="404" font-family="Inter, Arial, sans-serif" font-size="18" fill="#52525B">For founders, developers, and designers who build in public.</text>
  <text x="60" y="428" font-family="Inter, Arial, sans-serif" font-size="18" fill="#52525B">Find the right teammates. Ship the thing. For real this time.</text>

  <!-- 4 feature tiles -->
  <rect x="60" y="468" width="54" height="54" rx="10" fill="#EFF6FF" />
  <circle cx="84" cy="489" r="9" fill="none" stroke="#2563EB" stroke-width="2.5" />
  <line x1="91" y1="496" x2="100" y2="505" stroke="#2563EB" stroke-width="2.5" stroke-linecap="round" />
  <text x="60" y="542" font-family="Unbounded, Arial, sans-serif" font-weight="700" font-size="13" fill="#09090B">Discover</text>

  <rect x="180" y="468" width="54" height="54" rx="10" fill="#F0FDF4" />
  <circle cx="204" cy="492" r="8" fill="none" stroke="#16A34A" stroke-width="2.5" />
  <circle cx="218" cy="492" r="8" fill="none" stroke="#16A34A" stroke-width="2.5" />
  <text x="180" y="542" font-family="Unbounded, Arial, sans-serif" font-weight="700" font-size="13" fill="#09090B">Connect</text>

  <rect x="300" y="468" width="54" height="54" rx="10" fill="#EFF6FF" />
  <polyline points="312,505 327,487 342,500" fill="none" stroke="#2563EB" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  <text x="300" y="542" font-family="Unbounded, Arial, sans-serif" font-weight="700" font-size="13" fill="#09090B">Build</text>

  <rect x="420" y="468" width="54" height="54" rx="10" fill="#F0FDF4" />
  <line x1="438" y1="505" x2="454" y2="487" stroke="#16A34A" stroke-width="2.5" stroke-linecap="round" />
  <polyline points="444,487 454,487 454,497" fill="none" stroke="#16A34A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  <text x="420" y="542" font-family="Unbounded, Arial, sans-serif" font-weight="700" font-size="13" fill="#09090B">Grow</text>

  <!-- Right: App preview mockup card -->
  <rect x="660" y="80" width="490" height="400" rx="16" fill="#FFFFFF" stroke="#E4E4E7" stroke-width="1.5" />

  <!-- Mockup topbar -->
  <rect x="660" y="80" width="490" height="52" rx="16" fill="#FFFFFF" />
  <rect x="660" y="116" width="490" height="16" fill="#FFFFFF" />
  <!-- diamond mark small -->
  <path d="M688 98 L680 106 L688 106 Z" fill="#2563EB" />
  <path d="M688 106 L696 106 L688 114 Z" fill="#16A34A" />
  <text x="702" y="112" font-family="Unbounded, Arial, sans-serif" font-weight="700" font-size="13" fill="#09090B">Idea Blend</text>
  <!-- CTA in mockup -->
  <rect x="1090" y="94" width="48" height="26" rx="6" fill="#2563EB" />
  <text x="1114" y="112" font-family="Inter, Arial, sans-serif" font-weight="600" font-size="10" fill="#FFFFFF" text-anchor="middle">+ New</text>
  <!-- divider -->
  <line x1="660" y1="132" x2="1150" y2="132" stroke="#E4E4E7" stroke-width="1" />

  <!-- Mockup content: Featured section -->
  <text x="684" y="160" font-family="Unbounded, Arial, sans-serif" font-weight="700" font-size="13" fill="#09090B">Featured Projects</text>

  <rect x="684" y="172" width="450" height="72" rx="10" fill="#FAFAFA" stroke="#E4E4E7" />
  <rect x="696" y="186" width="48" height="20" rx="5" fill="#EFF6FF" />
  <text x="720" y="200" font-family="Inter, Arial, sans-serif" font-size="10" fill="#1D4ED8" text-anchor="middle">MVP</text>
  <text x="754" y="199" font-family="Inter, Arial, sans-serif" font-weight="600" font-size="12" fill="#09090B">BuildStack</text>
  <text x="696" y="224" font-family="Inter, Arial, sans-serif" font-size="11" fill="#71717A">Open-source project management for indie teams</text>
  <text x="1094" y="211" font-family="Inter, Arial, sans-serif" font-size="11" fill="#16A34A">4/6 filled →</text>

  <rect x="684" y="254" width="450" height="72" rx="10" fill="#FAFAFA" stroke="#E4E4E7" />
  <rect x="696" y="268" width="48" height="20" rx="5" fill="#F0FDF4" />
  <text x="720" y="282" font-family="Inter, Arial, sans-serif" font-size="10" fill="#15803D" text-anchor="middle">BETA</text>
  <text x="754" y="281" font-family="Inter, Arial, sans-serif" font-weight="600" font-size="12" fill="#09090B">TrackR</text>
  <text x="696" y="306" font-family="Inter, Arial, sans-serif" font-size="11" fill="#71717A">Real-time issue tracker with live collaboration</text>
  <text x="1094" y="293" font-family="Inter, Arial, sans-serif" font-size="11" fill="#16A34A">3/5 filled →</text>

  <!-- Active builders -->
  <text x="684" y="352" font-family="Unbounded, Arial, sans-serif" font-weight="700" font-size="13" fill="#09090B">Active Builders</text>
  <circle cx="700" cy="380" r="14" fill="#2563EB" />
  <circle cx="730" cy="380" r="14" fill="#16A34A" />
  <circle cx="760" cy="380" r="14" fill="#E4E4E7" />
  <text x="714" y="380" font-family="Inter, Arial, sans-serif" font-size="10" fill="#FFFFFF" text-anchor="middle" dominant-baseline="middle">MA</text>
  <text x="744" y="380" font-family="Inter, Arial, sans-serif" font-size="10" fill="#FFFFFF" text-anchor="middle" dominant-baseline="middle">SC</text>
  <text x="774" y="380" font-family="Inter, Arial, sans-serif" font-size="10" fill="#71717A" text-anchor="middle" dominant-baseline="middle">DO</text>
  <text x="800" y="384" font-family="Inter, Arial, sans-serif" font-size="12" fill="#71717A">+ 24 online now</text>

  <!-- Footer bar - flat, no gradient -->
  <rect x="0" y="580" width="1200" height="50" fill="#09090B" />
  <text x="60" y="612" font-family="Inter, Arial, sans-serif" font-size="14" fill="#A1A1AA">ideablend.vercel.app</text>
  <text x="680" y="612" font-family="Inter, Arial, sans-serif" font-size="14" fill="#A1A1AA">Find people. Build together. Ship something real.</text>
</svg>
